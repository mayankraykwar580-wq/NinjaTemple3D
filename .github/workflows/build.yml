name: Embed Three.js offline
      run: |
        curl -o /tmp/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
        python3 -c "
        with open('/tmp/three.min.js', 'r') as f:
            three = f.read()
        with open('app/src/main/assets/game.html', 'r') as f:
            html = f.read()
        old = '<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"></script>'
        new = '<script>' + three + '</script>'
        html = html.replace(old, new)
        with open('app/src/main/assets/game.html', 'w') as f:
            f.write(html)
        print('Done!')
        "
